[package]
name = "ccli"
version = "1.1.0"
edition = "2021"
description = "Confluence Data Center CLI"
license = "MIT"

[[bin]]
name = "ccli"
path = "src/main.rs"

[dependencies]
base64 = "0.22"
bytes = "1"
clap = { version = "4.6", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.13", features = ["json", "query", "multipart"] }
mime_guess = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
anyhow = "1"
thiserror = "2"
dialoguer = { version = "0.12", features = ["password"] }
comfy-table = "7"
is-terminal = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
home = "0.5"
ratatui = "0.30"
crossterm = "0.29"
nucleo-matcher = "0.3"
open = "5"
quick-xml = "0.40"

[dev-dependencies]
tempfile = "3"
httpmock = "0.7"
